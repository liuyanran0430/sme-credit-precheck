[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# 默认连接，实际运行时会由 alembic/env.py 使用 app.core.config 中的 DATABASE_URL 覆盖
sqlalchemy.url = mysql+pymysql://root:your_password@127.0.0.1:3306/sme_credit?charset=utf8mb4

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
