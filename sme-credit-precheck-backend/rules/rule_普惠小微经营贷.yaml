# ============================================================
# 准入规则文件 —— 普惠小微经营贷（产品前缀 AP）
# 版本：v2026-10-28
# 说明：每条规则含 rule_id / rule_name / kind / source / field
#       / operator / value / detail_zh。kind=hard 为强规则
#       （FAIL 直接拒绝），kind=soft 为弱规则（FAIL 仅影响打分）。
# ============================================================

version: v2026-10-28
updated_at: 2026-10-28
product: 普惠小微经营贷
product_code: AP

# ---------- 一、必交材料清单 ----------

# ---------- 二、准入规则 ----------
rules:

  # ==== 强规则（FAIL → 直接拒绝，不进入打分）====
  - rule_id: AP-H01
    rule_name: 营业执照存续
    kind: hard
    source: business_license
    field: registration_status
    operator: in
    value: [存续, 在营, 开业]
    fail_action: reject
    detail_zh: 营业执照状态需为存续/在营，已吊销、注销、迁出或非正常直接拒绝

  - rule_id: AP-H02
    rule_name: 成立年限 ≥ 2 年
    kind: hard
    source: business_license
    field: established_months
    operator: gte
    value: 24
    detail_zh: 成立不足 24 个月的企业不接受

  - rule_id: AP-H03
    rule_name: 统一社会信用代码有效
    kind: hard
    source: business_license
    field: credit_code_format
    operator: eq
    value: valid
    detail_zh: 信用代码 18 位且校验位合法

  - rule_id: AP-H04
    rule_name: 征信授权书有效
    kind: hard
    source: credit_auth
    field: auth_valid_months
    operator: gte
    value: 6
    detail_zh: 授权书签署日期需在近 6 个月内，且授权有效期覆盖申请提交日

  - rule_id: AP-H05
    rule_name: 流水覆盖 12 个月
    kind: hard
    source: bank_statement
    field: statement_coverage_months
    operator: gte
    value: 12
    detail_zh: 流水合计需无断月覆盖 12 个月

  # ==== 弱规则（FAIL 不拦截，但影响打分 / 评级）====
  - rule_id: AP-S01
    rule_name: 12 个月流水贷方合计 ≥ 年营收 70%
    kind: soft
    source: [bank_statement, financial_report]
    field: annual_inflow_ratio
    operator: gte
    value: 0.70
    detail_zh: 流水进账与营收差异过大提示收入虚增风险

  - rule_id: AP-S02
    rule_name: 资产负债率 ≤ 70%
    kind: soft
    source: financial_report
    field: debt_ratio
    operator: lte
    value: 0.70
    detail_zh: 负债率过高提示偿债能力不足

  - rule_id: AP-S03
    rule_name: 净利润为正
    kind: soft
    source: financial_report
    field: net_profit
    operator: gt
    value: 0
    detail_zh: 年度净利润为负提示亏损经营

  - rule_id: AP-S04
    rule_name: 申请金额 ≤ 年营收 × 30%
    kind: soft
    source: [application, financial_report]
    field: loan_to_revenue
    operator: lte
    value: 0.30
    detail_zh: 超过提示过度授信

  - rule_id: AP-S05
    rule_name: 申请金额 ≤ 净资产 × 80%
    kind: soft
    source: [application, financial_report]
    field: loan_to_net_asset
    operator: lte
    value: 0.80
    detail_zh: 超过提示杠杆过高

  - rule_id: AP-S06
    rule_name: 纳税申报上1年无重大欠税
    kind: soft
    source: tax_return
    field: has_major_tax_debt
    operator: eq
    value: false
    detail_zh: 如有重大欠税记录提示关注

  - rule_id: AP-S07
    rule_name: 流水期末余额与财报货币资金差异 ≤ 20%
    kind: soft
    source: [bank_statement, financial_report]
    field: cash_diff_ratio
    operator: lte
    value: 0.20
    detail_zh: 差异过大提示数据不一致

# ---------- 三、评分与等级 ----------
scoring:
  hard_rules_reject: true
  soft_rule_score: 14          # 每条弱规则 PASS +14 分，7 条满分 98
  base_score: 2                 # 硬规则全 PASS 即得基础分 2
  level_thresholds:
    A: [90, 100]                # ≥ 90
    B: [75, 89]
    C: [60, 74]
    D: [0, 59]
  level_label:
    A: 优秀
    B: 良好
    C: 一般
    D: 较差
  level_note:
    A: 可自动审批
    B: 建议优先审批
    C: 需人工复核后审批
    D: 谨慎受理或建议降额

# ---------- 四、结论口径 ----------
conclusion_logic:
  hard_rule_fail: reject        # 强规则 FAIL → 拒绝
  completeness_issue: manual    # 缺件/不可读 → 待补件
  consistency_high_fail: attention  # 一致性 high FAIL → 待人工核验
  soft_rule_fail_count_ge_3: attention  # ≥ 3 条弱规则 FAIL → 待人工核验
  else: pass                    # 其余 → 通过，按得分分 A/B/C/D
