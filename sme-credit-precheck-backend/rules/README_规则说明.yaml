# 准入规则文件 —— 公共模板（四款产品共用的字段说明）
# 版本：v2026-10-28
#
# 本文件不是有效规则文件，仅用于说明规则 YAML 的字段含义与约定。
# 实际生效的规则文件是同目录下的 rule_*.yaml，按申请产品加载对应文件。
#
# =====================================================
# 一、顶层字段
# =====================================================
#
# version:          规则版本号，落库到 AiReport.rule_version，用于回溯历史
# updated_at:       规则文件更新日期
# product:          贷款产品中文名，与 applications.product 字段一致
# product_code:     产品编号前缀（AP / AK / AJ / AE）
#
# =====================================================
# 二、必交材料清单（required_categories）
# =====================================================
#
# category:         材料类别编码（同 MaterialCategory 枚举）
# min_count:        最少需提供的份数
# min_months:       流水类：最少覆盖月数；财报类：年度数；纳税类：年度数
# required_tables:  财报类：必须具备的报表名称列表
# optional:         true 表示可选材料（不参与完整性判定，但参与一致性校验）
# desc:             中文说明
#
# 可用的 category 编码：
#   business_license  营业执照
#   bank_statement     银行流水
#   financial_report   财务报表
#   tax_return         纳税申报表
#   credit_auth        征信授权书
#   other              其他（含抵押物证明、科技资质证书等）
#
# =====================================================
# 三、规则字段（rules 数组）
# =====================================================
#
# rule_id:          规则唯一标识，产品前缀 + H（强）/S（弱）+ 序号，如 AP-H01
# rule_name:        中文规则名称
# kind:             hard（强规则，FAIL → 拒绝）/ soft（弱规则，FAIL → 影响打分）
# source:           证据来源材料类别（可数组，表示跨材料校验）
# field:            证据字段名（规则引擎从 extracted_fields 读取的字段 key）
# operator:         比较操作符
#   eq    等于          neq   不等于
#   gt    大于          gte   大于等于
#   lt    小于          lte   小于等于
#   in    在列表中      not_in 不在列表中
#   contains 包含（字符串）
# value:            判定阈值；多值用数组，字符串/数字/布尔均可
# fail_action:       hard 规则专用，reject=拒绝 / manual=转人工
# detail_zh:        规则的中文业务说明（报告展示用）
# note:             可选。特殊场景说明，如"无财报时跳过此规则"
#
# =====================================================
# 四、评分配置（scoring）
# =====================================================
#
# hard_rules_reject:  true 表示强规则任一 FAIL 即直接拒绝
# soft_rule_score:    每条弱规则 PASS 加多少分
# base_score:         强规则全 PASS 的基础分（满分 100）
# level_thresholds:  通过人群的等级划分阈值 [下界, 上界]，按百分位或固定分
# level_label:        等级对应的中文标签
# level_note:         等级对应的处理建议
#
# =====================================================
# 五、结论口径（conclusion_logic）
# =====================================================
#
# hard_rule_fail:              reject —— 强规则 FAIL
# completeness_issue:          manual  —— 缺件 / 不可读
# consistency_high_fail:       attention —— 一致性高风险
# soft_rule_fail_count_ge_3:   attention —— ≥ 3 条弱规则 FAIL
# else:                        pass    —— 通过，按等级分档
#
# =====================================================
# 六、当前四款产品规则差异速览
# =====================================================
#
# 维度              普惠小微经营贷(AP)   小微快贷(AK)        经营性抵押贷(AJ)    科技e贷(AE)
# ──────────────    ────────────────     ──────────────      ───────────────     ────────────
# 成立年限          ≥ 2 年（硬规则）      ≥ 1 年（硬规则）    ≥ 1 年（硬规则）     ≥ 1 年（硬规则）
# 流水月数          ≥ 12 月              ≥ 6 月              ≥ 6 月               ≥ 6 月
# 财报要求          三表齐全（硬规则）    可选                资产负债+利润表      资产负债+利润表
# 抵押物材料        无                   无                  至少 1 份 other      无
# 科技资质          无                   无                  无                   硬规则必须
# 弱规则数          7 条                 6 条                6 条                7 条
# 负债率阈值        ≤ 70%                ≤ 75%               ≤ 80%               ≤ 60%
# 流水/营收比       ≥ 70%                ≥ 40%               ≥ 50%               ≥ 30%
# 申请金额/营收     ≤ 30%                ≤ 10%（流水贷方）    ≤ 40%               ≤ 50%
# 单户上限          无硬规则限制         ≤ 300 万（软规则）   无硬规则限制         无硬规则限制
